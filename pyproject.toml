[project]
name = "techflow-tasks"
version = "0.1.0"
description = "Sistema web de gerenciamento de tarefas ágeis - TechFlow Solutions"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: erros e pyflakes | I: ordenação de imports | B: bugbear | UP: sintaxe moderna
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends() como valor padrão é o padrão de injeção de dependência do FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
